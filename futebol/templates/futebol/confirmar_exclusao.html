{% extends 'futebol/base.html' %}

{% block titulo %}{{ titulo }}{% endblock %}

{% block conteudo %}
<div class="form-wrap">
    <div class="page-head">
        <div>
            <span class="eyebrow">Confirmação</span>
            <h1>{{ titulo }}</h1>
        </div>
    </div>

    <form method="post" class="card" novalidate>
        {% csrf_token %}
        <p>{{ descricao }} Esta ação não pode ser desfeita.</p>

        <div class="form-acoes">
            <button type="submit" class="btn btn--perigo">Confirmar exclusão</button>
            <a href="{{ voltar_url }}" class="btn btn--secundario">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
