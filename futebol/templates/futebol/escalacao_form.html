{% extends 'futebol/base.html' %}

{% block titulo %}{{ titulo }}{% endblock %}

{% block conteudo %}
<div class="form-wrap">
    <div class="page-head">
        <div>
            <span class="eyebrow">Time</span>
            <h1>{{ titulo }}</h1>
            <p class="page-head__sub">
                A formação define quantas vagas existem por posição no campo.
            </p>
        </div>
    </div>

    <form method="post" class="card" novalidate>
        {% csrf_token %}
        {% include 'futebol/_campo_form.html' %}

        <div class="form-acoes">
            <button type="submit" class="btn btn--primario">{{ acao }}</button>
            <a href="{% if escalacao %}{{ escalacao.get_absolute_url }}{% else %}{% url 'futebol' %}{% endif %}"
               class="btn btn--secundario">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
